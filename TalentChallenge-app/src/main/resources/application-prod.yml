server:
  port: 8091
  base-url: http://43.142.157.145:8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据源与连接池配置
spring:
  datasource:
    username: root
    password: hgy123456
    url: jdbc:mysql://43.142.157.145:3306/talent_challenge?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: TalentChallengeHikari
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 10000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  rabbitmq:
    host: ${RABBITMQ_HOST:43.142.157.145}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2
        max-interval: 10000ms
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
          max-interval: 10000ms

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  #  config-location:  classpath:/mybatis/config/mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

app:
  snowflake:
    data-center-id: ${SNOWFLAKE_DATA_CENTER_ID:1}
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
  jwt:
    secret: 
    expiration: 7200000
    refresh-expiration: 604800000

# 文件上传配置
file:
  upload:
    path:
      milestones: /home/hgy/TalentChallenge/files/milestones
      qualifications: /home/hgy/TalentChallenge/files/qualifications
      bids: /home/hgy/TalentChallenge/files/bids
    max-size: 10485760
    allowed-types: pdf,doc,docx,jpg,jpeg,png,zip,rar
