spring:
  config:
    name: TalentChallenge-app
  profiles:
    active: prod
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# 文件上传配置
file:
  upload:
    path:
      milestones: ./files/milestones
      qualifications: ./files/qualifications
      bids: ./files/bids
    max-size: 10485760  # 10MB（字节）
    allowed-types: pdf,doc,docx,jpg,jpeg,png,zip,rar
